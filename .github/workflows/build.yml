name: Build MediaMagnet

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Ensure pyinstaller is installed if not in requirements.txt
          pip install pyinstaller 
      
      - name: Verify assets folder
        run: |
          if (Test-Path "assets") {
            Write-Host "Assets folder found"
            Get-ChildItem -Path assets -Recurse | Select-Object FullName
          } else {
            Write-Host "Assets folder not found!"
            exit 1
          }
        shell: pwsh
        
      - name: Download FFmpeg (for bundling)
        run: |
          $Url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          $ZipPath = "ffmpeg.zip"
          $Dest = "assets"
          
          # Create assets directory if missing
          if (!(Test-Path $Dest)) { New-Item -ItemType Directory -Path $Dest }
          
          # Download
          Invoke-WebRequest -Uri $Url -OutFile $ZipPath
          
          # Extract specific file (ffmpeg.exe)
          Expand-Archive -Path $ZipPath -DestinationPath "temp_ffmpeg"
          # Move just the executable to assets/
          Move-Item -Path "temp_ffmpeg/*/bin/ffmpeg.exe" -Destination "assets/ffmpeg.exe" -Force
          
          # Cleanup
          Remove-Item $ZipPath
          Remove-Item "temp_ffmpeg" -Recurse -Force
          
          Write-Host "✅ FFmpeg placed in assets/"
        shell: pwsh

      # --- Auto-select Option 1 (One Directory + zip) ---
      - name: Run PyInstaller build
        run: echo "1" | python build.py
        shell: pwsh

      - name: Verify build output
        run: |
          if (Test-Path "dist/MediaMagnet/MediaMagnet.exe") {
            Write-Host "Executable built successfully"
            Get-Item dist/MediaMagnet/MediaMagnet.exe | Select-Object Name, Length, LastWriteTime
          } else {
            Write-Host "Executable not found in output folder!"
            exit 1
          }
          # Also verify the zip was created
          $zip = Get-Item dist/MediaMagnet-v*-Windows.zip -ErrorAction SilentlyContinue
          if ($zip) {
            Write-Host "Archive created: $($zip.Name) ($([math]::Round($zip.Length / 1MB, 1)) MB)"
          } else {
            Write-Host "WARNING: .zip archive not found"
          }
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaMagnet-Windows
          path: dist/MediaMagnet-v*-Windows.zip
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/MediaMagnet-v*-Windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}    